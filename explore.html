<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Coding Doubts | CampusConnect - Doubt Exchange</title>
    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

    <div class="app-wrapper">
        <!-- Sidebar Navigation -->
        <aside class="app-sidebar" id="app-sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="brand-logo">
                    <div class="brand-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span>Campus<span class="brand-accent">Connect</span></span>
                </a>
            </div>

            <div class="sidebar-content">
                <div>
                    <div class="sidebar-ask-btn-wrap">
                        <a href="ask-doubt.html" class="btn btn-primary sidebar-ask-btn">
                            <i class="fa-solid fa-plus-circle"></i> Ask a Doubt
                        </a>
                    </div>

                    <ul class="sidebar-nav-list">
                        <li>
                            <a href="dashboard.html" class="sidebar-nav-link">
                                <i class="fa-solid fa-gauge"></i>
                                <span>Dashboard</span>
                            </a>
                        </li>
                        <li>
                            <a href="explore.html" class="sidebar-nav-link active">
                                <i class="fa-solid fa-compass"></i>
                                <span>Explore Doubts</span>
                            </a>
                        </li>
                        <li>
                            <a href="ask-doubt.html" class="sidebar-nav-link">
                                <i class="fa-solid fa-circle-question"></i>
                                <span>Ask a Doubt</span>
                            </a>
                        </li>
                        <li>
                            <a href="profile.html?tab=questions" class="sidebar-nav-link">
                                <i class="fa-solid fa-user-pen"></i>
                                <span>My Questions</span>
                            </a>
                        </li>
                        <li>
                            <a href="profile.html?tab=bookmarks" class="sidebar-nav-link">
                                <i class="fa-solid fa-bookmark"></i>
                                <span>Saved Doubts</span>
                            </a>
                        </li>
                        <li>
                            <a href="profile.html" class="sidebar-nav-link">
                                <i class="fa-solid fa-id-card"></i>
                                <span>Profile</span>
                            </a>
                        </li>
                    </ul>

                    <div class="sidebar-divider"></div>

                    <ul class="sidebar-nav-list">
                        <li>
                            <a href="javascript:void(0)" onclick="handleLogout()" class="sidebar-nav-link" style="color: var(--danger);">
                                <i class="fa-solid fa-right-from-bracket" style="color: var(--danger);"></i>
                                <span>Logout</span>
                            </a>
                        </li>
                    </ul>
                </div>

                <div id="sidebar-user-info" class="sidebar-user-card" onclick="window.location.href='profile.html'" style="cursor: pointer;">
                    <!-- Injected dynamically -->
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="app-main">
            <!-- App Header -->
            <header class="app-header">
                <div class="app-header-left">
                    <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" aria-label="Toggle sidebar menu">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                    <h2 class="app-page-title">Explore Coding Doubts</h2>
                </div>

                <div class="app-header-right">
                    <div class="notif-dropdown-wrapper">
                        <button class="notif-bell-btn" id="notif-bell-btn" aria-label="Notifications">
                            <i class="fa-regular fa-bell"></i>
                            <span class="notif-badge" id="notif-badge" style="display: none;">0</span>
                        </button>

                        <div class="notif-dropdown" id="notif-dropdown">
                            <div class="notif-header">
                                <span>Peer Notifications</span>
                                <button class="notif-clear-btn" onclick="Storage.markNotificationsRead(); this.closest('.notif-dropdown').classList.remove('show');">Mark all read</button>
                            </div>
                            <ul class="notif-list" id="notif-list"></ul>
                        </div>
                    </div>

                    <div class="header-user-pill" id="header-user-pill"></div>
                </div>
            </header>

            <!-- Explore Content Body -->
            <main class="app-content">
                <!-- Search & Filters Header Card -->
                <div class="explore-header-card">
                    <!-- Universal Realtime Search Bar -->
                    <div class="search-bar-wrap">
                        <i class="fa-solid fa-magnifying-glass search-icon"></i>
                        <input 
                            type="text" 
                            id="explore-search-input" 
                            class="search-input" 
                            placeholder="Search questions by title, code keywords, programming language, or error trace..."
                        >
                        <button type="button" id="search-clear-btn" class="search-clear-btn" aria-label="Clear search">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <!-- Filter Bar (Category Pills + Status Filter) -->
                    <div class="category-filter-bar">
                        <div class="category-pills">
                            <button class="cat-pill active" data-cat="All">All Categories</button>
                            <button class="cat-pill" data-cat="C">C Language</button>
                            <button class="cat-pill" data-cat="Python">Python</button>
                            <button class="cat-pill" data-cat="Java">Java</button>
                            <button class="cat-pill" data-cat="DSA">DSA</button>
                            <button class="cat-pill" data-cat="Web Development">Web Development</button>
                        </div>

                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <label for="status-filter-select" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">Status:</label>
                            <select id="status-filter-select" class="status-filter-select">
                                <option value="all">All Doubts</option>
                                <option value="solved">Solved (Best Answer)</option>
                                <option value="unsolved">Needs Solution</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Results Counter & Action -->
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem;">
                    <div id="explore-results-count" style="font-size: 0.9rem; font-weight: 600; color: var(--text-muted);">
                        Showing questions...
                    </div>
                    <a href="ask-doubt.html" class="btn btn-primary btn-sm">
                        <i class="fa-solid fa-plus"></i> Ask New Doubt
                    </a>
                </div>

                <!-- Doubts Cards Feed List -->
                <div class="doubts-list" id="explore-doubts-feed">
                    <!-- Rendered dynamically by doubts.js -->
                </div>
            </main>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/main.js"></script>
    <script src="js/doubts.js"></script>
</body>
</html>
